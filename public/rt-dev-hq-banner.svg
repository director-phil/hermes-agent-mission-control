<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="RT Dev HQ - mission control for your self-hosted Hermes agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.84" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#6EA8FE" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#6EA8FE" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6EA8FE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EA8FE"/>
      <stop offset="1" stop-color="#6EA8FE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF"/>
    </pattern>
    <style>
      .brand { font-family: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono  { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- ground -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.045"/>
  <rect width="1200" height="320" fill="url(#aura)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" fill="none" stroke="#1E2229" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="72" y="150" class="brand" font-size="86" font-weight="700" fill="#F3F5F7" letter-spacing="-2.5">RT Dev HQ</text>
  <rect x="76" y="172" width="352" height="3" rx="1.5" fill="url(#rule)"/>

  <!-- tagline -->
  <text x="77" y="214" class="brand" font-size="25" font-weight="400" fill="#9AA1AA">Mission control for your self-hosted Hermes agent</text>

  <!-- stack chip -->
  <g>
    <rect x="76" y="240" width="322" height="30" rx="15" fill="#12151B" stroke="#262B34"/>
    <circle cx="95" cy="255" r="4" fill="#5FD0A0"/>
    <text x="110" y="259" class="mono" font-size="12.5" fill="#8A9099" letter-spacing="1.5">NEXT.JS 16  ·  PRISMA  ·  POSTGRES BUS</text>
  </g>

  <!-- architecture motif: website -> postgres bus -> hermes -->
  <g class="mono" font-size="12.5" text-anchor="middle" letter-spacing="0.5">
    <line x1="1004" y1="94" x2="1004" y2="128" stroke="#6EA8FE" stroke-opacity="0.55" stroke-width="1.5"/>
    <line x1="1004" y1="176" x2="1004" y2="210" stroke="#6EA8FE" stroke-opacity="0.55" stroke-width="1.5"/>

    <rect x="928" y="62" width="152" height="34" rx="9" fill="#12151B" stroke="#2A2F38"/>
    <text x="1004" y="84" fill="#C6CAD1">WEBSITE</text>

    <rect x="906" y="130" width="196" height="38" rx="9" fill="#0F1621" stroke="#6EA8FE" stroke-opacity="0.65"/>
    <circle cx="936" cy="149" r="4" fill="#6EA8FE"/>
    <text x="1010" y="154" fill="#EAF1FF">POSTGRES BUS</text>

    <rect x="928" y="204" width="152" height="34" rx="9" fill="#12151B" stroke="#2A2F38"/>
    <text x="1004" y="226" fill="#C6CAD1">HERMES</text>
  </g>
</svg>
